[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "precision-click"
version = "1.0.0"
description = "High-precision automated mouse clicking tool with millisecond scheduling."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  { name="Mohammad Hussein Ghaffouri", email="your-email@example.com" }
]
keywords = ["automation", "mouse", "clicker", "windows", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pynput>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pytest",
    "pyinstaller",
]

[tool.black]
line-length = 88
target-version = ['py311']

